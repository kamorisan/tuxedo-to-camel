apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  namespace: NAMESPACE_PLACEHOLDER
  labels:
    app: webui
    app.kubernetes.io/name: webui
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: tuxedo-to-camel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
        app.kubernetes.io/name: webui
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: webui
        image: image-registry.openshift-image-registry.svc:5000/demo-webui/webui:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        env:
        - name: JAVA_OPTS
          value: "-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager"
        - name: TUXEDO_URL
          value: "TUXEDO_URL_PLACEHOLDER"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
