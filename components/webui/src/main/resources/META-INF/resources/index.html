<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuxedo Message Sender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .flow-diagram {
            background: #f5f5f5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 30px;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            overflow-x: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            display: block;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .result-message {
            font-size: 14px;
        }

        .timestamp {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tuxedo Message Sender</h1>
<!--        <p class="subtitle">Web → Tuxedo → AMQ → Camel → Kafka デモシステム</p>
-->
        <div class="flow-diagram">
Web UI → Tuxedo Service → Tuxedo /Q → Apache Camel → Kafka Broker
        </div>

        <form id="messageForm">
            <div class="form-group">
                <label for="message">メッセージを入力してください：</label>
                <input
                    type="text"
                    id="message"
                    name="message"
                    placeholder="例: Hello World!"
                    required
                    autofocus
                >
            </div>
            <button type="submit" id="submitBtn">
                <span id="btnText">Tuxedoへ送信</span>
            </button>
        </form>

        <div id="result" class="result"></div>
    </div>

    <script>
        const form = document.getElementById('messageForm');
        const messageInput = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const resultDiv = document.getElementById('result');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const message = messageInput.value.trim();
            if (!message) return;

            // ボタンを無効化
            submitBtn.disabled = true;
            btnText.innerHTML = '送信中<span class="loading"></span>';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch('/api/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: message
                });

                const result = await response.json();

                if (response.ok) {
                    showResult('success', 'Success', result.message, result.timestamp);
                    messageInput.value = '';
                } else {
                    showResult('error', 'Error', result.message, result.timestamp);
                }
            } catch (error) {
                showResult('error', 'Connection Error',
                    `Failed to connect to server: ${error.message}`,
                    new Date().toISOString());
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Tuxedoへ送信';
            }
        });

        function showResult(type, title, message, timestamp) {
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `
                <div class="result-title">${title}</div>
                <div class="result-message">${message}</div>
                <div class="timestamp">${new Date(timestamp).toLocaleString('ja-JP')}</div>
            `;
        }
    </script>
</body>
</html>
