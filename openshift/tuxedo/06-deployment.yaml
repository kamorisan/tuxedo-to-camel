apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuxedo-msgsvc
  namespace: demo-tuxedo
  labels:
    app: tuxedo-msgsvc
    app.kubernetes.io/component: tuxedo
    app.kubernetes.io/part-of: tuxedo-to-camel-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tuxedo-msgsvc
  template:
    metadata:
      labels:
        app: tuxedo-msgsvc
        app.kubernetes.io/component: tuxedo
    spec:
      containers:
        - name: tuxedo
          image: image-registry.openshift-image-registry.svc:5000/demo-tuxedo/tuxedo-msgsvc:latest
          imagePullPolicy: Always
          command: ["/u01/oracle/user_projects/tuxdemo/start-mock.sh"]
          ports:
            - containerPort: 8080
              protocol: TCP
              name: wsl
          env:
            - name: AMQ_HOST
              value: "amq-broker-amqp-0-svc.demo-amq.svc.cluster.local"
            - name: AMQ_PORT
              value: "5672"
            - name: AMQ_QUEUE
              value: "TUXEDO.OUT"
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: "1Gi"
              cpu: "1000m"
            requests:
              memory: "512Mi"
              cpu: "500m"
